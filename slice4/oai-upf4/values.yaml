kubernetesDistribution: Vanilla  #Vanilla for community kubernetes distribution else Openshift for Openshift

## In case of using these charts on Openshift then please use UBI images
## To know more about them follow this tutorial https://gitlab.eurecom.fr/oai/cn5g/oai-cn5g-fed/-/tree/master/openshift
nfimage:
  repository: docker.io/library/oai-upf-vpp # UPF-VPP image built locally (see README)
  version: v2.2.1          #image tag
  # pullPolicy: IfNotPresent or Never or Always
  pullPolicy: Never

## good to use when pulling images from docker-hub
# imagePullSecrets:
#   - name: "regcred"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "oai-upf4-sa"

podSecurityContext:
  runAsUser: 0
  runAsGroup: 0

#service type is fixed to clusterIP, it is only support for non multus interface (eth0)
exposedPorts:
  sbi: 80
  n4: 8805 # default port no need to change unless necessary
  n3: 2152 # default port no need to change unless necessary

# oai-upf can be configured with multiple interface which may correspond to 3GPP logical interfaces. There can be one to one or one to many. 
# In case of one to one mapping n3,n4,n6 all can have separate virtual interfaces. 
# In one to many mapping n3,n4,n6 all can be mapped to one virtual interface. 
# Interface mapping is strictly based on your networking environment 
## Change these ip-addresses according to your environment 

staticClusterIP: "10.110.99.104" # fixed: the SMF resolves this UPF-VPP's FQDN through a hostAliases entry pointing here

multus:
  ## If you don't want to add a default route in your pod then leave this field empty
  defaultGateway: ""
  # oai-upf-vpp takes over its interfaces directly (VPP/AF_PACKET), unlike the simpleswitch
  # oai-upf it replaces, so N3 and N6 each NEED their own dedicated interface -> Multus is
  # mandatory for those two, it is not just an option here.
  n3Interface: # N3 (GTP-U to the gNB)
    create: true
    ipAdd: "10.100.3.104" # inside the br-n3 bridge subnet (10.100.3.0/24) provisioned on the node by the host-net-setup DaemonSet
    netmask: "24"
    name: "n3"
    ## If you do not have a gateway leave the field empty
    gateway: ""
    ## If you do not want to add any routes in your pod then leave this field empty
    routes: ""
    hostInterface: "br-n3" # pre-existing Linux bridge on the k8s node (created on every node by 5g_core host-net-setup DaemonSet, see oai-5g-core/host-net-setup)
  n4Interface:
    # N4 (PFCP to the SMF) and the SBI registration to the NRF stay on the pod's default eth0
    # (cluster network) instead, reusing $(POD_IP) at runtime - see templates/deployment.yaml.
    create: false
    ipAdd: "192.168.24.2"
    netmask: "24"
    name: "n4"
    ## If you do not have a gateway leave the field empty
    gateway: ""
    ## If you do not want to add any routes in your pod then leave this field empty
    routes: ""
    hostInterface: "bond0"
  n6Interface: # N6 (towards the Data Network)
    create: true
    ipAdd: "10.100.6.104" # inside the br-n6 bridge subnet (10.100.6.0/24) provisioned on the node by the host-net-setup DaemonSet
    name: "n6"
    netmask: "24"
    ## If you do not have a gateway leave the field empty
    gateway: ""
    ## If you do not want to add any routes in your pod then leave this field empty
    routes: ""
    hostInterface: "br-n6" # pre-existing Linux bridge on the k8s node (created on every node by 5g_core host-net-setup DaemonSet, see oai-5g-core/host-net-setup)

## oai-upf-vpp specific configuration. This image is configured purely through environment
## variables (see templates/deployment.yaml) - it does NOT read a config.yaml, unlike the
## simpleswitch oai-upf it replaces, so the configmap/config.yaml used to exist here has
## been removed.
vpp:
  name: "VPP-UPF-SLICE4"
  mcc: "001"
  mnc: "01"
  realm: "3gppnetwork.org"
  mainCore: "0"
  coreWorker: "1"
  # Ubuntu 22.04/24.04-based image path shown below; use /usr/lib64/vpp_plugins/ for RHEL/UBI images
  pluginPath: "/usr/lib/x86_64-linux-gnu/vpp_plugins/"
  snssai:
    sst: "2"
    sd: "000002" # SD of slice 4 (S-NSSAI SST 2 / SD 000002); SNSSAI_SD is mandatory for oai-upf-vpp
  dnn: "oaid"
  registerNrf: "yes"
  nrf:
    host: "oai-nrf" # Kubernetes service name of the NRF used by this slice
    port: "80"
    httpVersion: "2"
  n3:
    nwi: "access.oai.org"
    dnai: "access"
  n6:
    nwi: "internet.oai.org"
    dnai: "internet"
    # Optional: static IP of the DN / traffic-generator pod if it is also attached to the
    # same Multus n6 network. Leave empty to skip setting IF_3_IP_REMOTE.
    remoteIp: ""

## Debugging section
start:
  tcpdump: false

includeTcpDumpContainer: false #If true it will add a tcpdump container inside network function pod for debugging

tcpdumpimage:
  repository: docker.io/oaisoftwarealliance/oai-tcpdump-init
  version: alpine-3.20
  #pullPolicy: IfNotPresent or Never or Always
  pullPolicy: IfNotPresent

securityContext:
  privileged: true

#To store PCAP of NF in a sharedVolume so it can be easily fetched (PVC is created with NRF charts so make sure in NRF it is true)
persistent:
  sharedvolume: false

## NF is the network function and tcpdump is the tcpdump container. 
## To know more about request and limit it is better to understand that how Kubernetes QoS works. 
## https://kubernetes.io/docs/concepts/configuration/manage-resources-containers
## https://kubernetes.io/docs/concepts/workloads/pods/pod-qos
resources:
  define: true
  limits:
    # oai-upf-vpp needs real headroom: it pre-allocates large buffer pools at startup
    # (128Mi -> OOMKilled almost immediately) and busy-polls its worker core, so it
    # constantly shows ~100% CPU even at idle - this is expected VPP behaviour, not a bug.
    define: true
    nf:
      cpu: "1"
      memory: 1Gi
    #If tcpdump container is disabled this value will not be used
    tcpdump:
      cpu: 100m
      memory: 128Mi
  requests:
    nf:
      cpu: 500m
      memory: 512Mi
    #If tcpdump container is disabled this value will not be used
    tcpdump:
      cpu: 100m
      memory: 128Mi

# oai-upf-vpp constantly runs its worker core near 100% (busy-poll dataplane), and this
# chart's Multus interfaces use a single STATIC IP per replica (no IP pool) - so CPU-based
# autoscaling would either never scale down or create replicas with clashing IPs. Disabled.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

readinessProbe: true

livenessProbe: false

terminationGracePeriodSeconds: 5

nodeSelector:
  elastic5g.io/radio-plane: "true"  # gNB and all UPF-VPP must sit on the same node (L2 adjacency on br-n3 / br-n6): kubectl label node <X> elastic5g.io/radio-plane=true
#id: "1" 
#app_ad: "2" #Slice differentiator
#nb_pods: "50"
nodeName:
