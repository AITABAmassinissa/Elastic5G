## @section Global parameters
## Global Docker image parameters
## Please, note that this will override the image parameters, including dependencies, configured to use the global value
## Current available global Docker image parameters: imageRegistry, imagePullSecrets and storageClass

## @param global.imageRegistry Global Docker image registry
## @param global.imagePullSecrets Global Docker registry secret names as an array
## @param global.storageClass Global StorageClass for Persistent Volume(s)
##
global:
  imageRegistry: ""
  ## E.g.
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  ##
  imagePullSecrets: []
  storageClass: ""

## @section Common parameters

## @param kubeVersion Override Kubernetes version
##
kubeVersion: ""
## @param nameOverride String to partially override common.names.fullname
##
nameOverride: ""
## @param fullnameOverride String to fully override common.names.fullname
##
fullnameOverride: ""
## @param commonLabels Labels to add to all deployed objects
##
commonLabels: {}
## @param commonAnnotations Annotations to add to all deployed objects
##
commonAnnotations: {}
## @param clusterDomain Kubernetes cluster domain name
##
clusterDomain: cluster.local
## @param extraDeploy Array of extra objects to deploy with the release
##
extraDeploy: []

image:
  registry: docker.io
  repository: gradiant/ueransim
  tag: 3.2.6
  ## Specify a imagePullPolicy
  ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
  ## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
  ##
  pullPolicy: Always
  ## Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ## e.g:
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  pullSecrets: []
  ## Enable debug mode
  ##
  debug: false

name: ueransim-gnb
amf:
  # if set amf.ip takes precedence over amf.hostname
  ip: ""
  hostname: oai-amf
interfaces:
  n2:
    dev: eth0
  # UPF-VPP needs N3 on its own dedicated interface (br-n3), separate from the cluster
  # network - the gNB must be attached to that same segment to actually reach it for GTP-U,
  # which is what multus.n3Interface below does.
  n3:
    dev: n3
  radio:
    dev: eth0
multus:
  n3Interface:
    create: true
    ipAdd: "10.100.3.200" # one shared IP: this single gNB reaches all UPF-VPP slices on the
                           # same br-n3 L2 segment (10.100.3.101 ... 10.100.3.104)
    netmask: "24"
    hostInterface: "br-n3" # Linux bridge created on every node by oai-5g-core/host-net-setup/daemonset.yaml
mcc: '001'
mnc: '01'
sst: 1 #for UE 
#sd: "0x000002" #for UE
#tac: '0001'

hpa:
 enabled: false

resources:
  limits: {}
  requests: {}
podSecurityContext:
  enabled: false
containerSecurityContext:
  enabled: false
podLabels: {}
podAnnotations: {}
affinity: {}
nodeSelector:
  elastic5g.io/radio-plane: "true"  # any node carrying this label (kubectl label node <X> elastic5g.io/radio-plane=true):
                                     # the gNB must be L2-adjacent to the UPF-VPP pods on the same br-n3 bridge
tolerations: []

ues:
  enabled: false
  count: 100
  initialMSISDN: '0000000102'
  key: fec86ba6eb707ed08905757b1bb44b8f
  op: C42449363BBAD02B66D16BC975D77CC1
  opType: OPC
  apnList:
    - type: 'IPv4'
      apn: 'oai'
      slice:
        sst: 1
        #sd: "0x000002"
      emergency: false
  resources:
    limits: {}
    requests: {}
  podSecurityContext:
    enabled: false
  containerSecurityContext:
    enabled: false
  podLabels: {}
  podAnnotations: {}
  affinity: {}
  nodeSelector: {}
  tolerations: []
