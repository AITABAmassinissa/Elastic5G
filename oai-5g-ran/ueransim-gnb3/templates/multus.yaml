{{- if .Values.multus.n3Interface.create }}
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ include "common.names.fullname" . }}-n3
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master":"{{ .Values.multus.n3Interface.hostInterface }}",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [
                {
                        "address":"{{ .Values.multus.n3Interface.ipAdd }}/{{ .Values.multus.n3Interface.netmask }}"
                }
        ]
      }
    }'
{{- end }}
