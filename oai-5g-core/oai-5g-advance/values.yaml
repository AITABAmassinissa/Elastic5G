oai-amf:
  enabled: true
  nfimage:  # image name either locally present or in a public/private repository
    repository: docker.io/library/oai-amf           ## The image will be pulled from dockerhub
    version: v2.2.1                                    ## The branch to be used to pull from dockerhub
    # pullPolicy: IfNotPresent or Never or Always
    pullPolicy: Never
  includeTcpDumpContainer: false #only for taking pcaps inside network function pod
  #imagePullSecrets:
   # - name: "regcred"
  multus:
    ## If you don't want to add a default route in your pod then replace this field with ""
    defaultGateway: ""
    n2Interface:
      create: false
      ipAdd: "172.21.6.94"
      netmask: "22"
      name: "n2"
      ## If you do not have a gateway leave the field empty
      gateway:
      ## If you do not want to add any routes in your pod then leave this field empty
      routes: [{'dst': '10.8.0.0/24','gw': '172.21.7.254'}]
      hostInterface: "bond0" # Interface of the host machine on which this pod will be scheduled
  nodeSelector: {}
oai-upf:
  enabled: true
  staticClusterIP: "10.110.99.101" # SMF resolves this UPF-VPP's FQDN via a hostAliases entry pointing here
  nfimage:  # image name either locally present or in a public/private repository
    repository: docker.io/library/oai-upf-vpp  ## UPF-VPP image built locally (see README)
    version: v2.2.1                                        ## image tag
    # pullPolicy: IfNotPresent or Never or Always
    pullPolicy: Never
  includeTcpDumpContainer: false #only for taking pcaps inside network function pod
  #imagePullSecrets:
   # - name: "regcred"
  # UPF-VPP takes over its interfaces directly (VPP/AF_PACKET) instead of routing via the
  # kernel like the simpleswitch UPF it replaces, so N3 and N6 each NEED their own dedicated
  # interface here - Multus is mandatory for those two, it's not just an option anymore.
  ## Change these ip-addresses according to your environment
  multus:
    ## If you don't want to add a default route in your pod then replace this field with ""
    defaultGateway: ""
    n3Interface: # N3 (GTP-U to the gNB)
      create: true
      ipAdd: "10.100.3.101" # inside the br-n3 bridge subnet (10.100.3.0/24) created by the host-net-setup DaemonSet
      netmask: "24"
      name: "n3"
      ## If you do not have a gateway leave the field empty
      gateway: ""
      ## If you don't want to add a default route in your pod then replace this field with ""
      routes: ""
      hostInterface: "br-n3"
    ## N4 (PFCP to the SMF) and the SBI registration to the NRF stay on the pod's default eth0
    ## (cluster network) instead, reusing $(POD_IP) at runtime - no Multus needed here.
    n4Interface:
      create: false
      ipAdd: "192.168.24.2"
      netmask: "24"
      name: "n4"
      ## If you do not have a gateway leave the field empty
      gateway: ""
      ## If you do not want to add any routes in your pod then leave this field empty
      routes: ""
      hostInterface: "bond0"
    n6Interface: # N6 (towards the Data Network)
      create: true
      ipAdd: "10.100.6.101" # inside the br-n6 bridge subnet (10.100.6.0/24) created by the host-net-setup DaemonSet
      name: "n6"
      netmask: "24"
      ## If you do not have a gateway leave the field empty
      gateway: ""
      ## If you do not want to add any routes in your pod then leave this field empty
      routes: ""
      hostInterface: "br-n6"
  ## UPF-VPP specific configuration (env-var driven, no config.yaml is used by this image).
  ## These match the subchart's own defaults in oai-5g-core/oai-upf/values.yaml - repeated
  ## here so they're visible/overridable from this top-level umbrella values.yaml too.
  vpp:
    name: "VPP-UPF-SLICE1"
    mcc: "001"
    mnc: "01"
    realm: "3gppnetwork.org"
    mainCore: "0"
    coreWorker: "1"
    pluginPath: "/usr/lib/x86_64-linux-gnu/vpp_plugins/"  # RHEL/UBI images: /usr/lib64/vpp_plugins/
    snssai:
      sst: "1"
      sd: "ffffff" # 3GPP "no SD" sentinel value (TS 23.003) - SNSSAI_SD is mandatory for UPF-VPP
    dnn: "oai"
    registerNrf: "yes"
    nrf:
      host: "oai-nrf"
      port: "80"
      httpVersion: "2"
    n3:
      nwi: "access.oai.org"
      dnai: "access"
    n6:
      nwi: "internet.oai.org"
      dnai: "internet"
      remoteIp: ""
  nodeSelector:
    elastic5g.io/radio-plane: "true"  # any node carrying this label (kubectl label node <X> elastic5g.io/radio-plane=true); gNB and UPF-VPP must share it

oai-traffic-server:
  enabled: true
  trafficServer:
    repository: docker.io/oaisoftwarealliance/trf-gen-cn5g
    version: latest
    #pullPolicy: IfNotPresent or Never or Always
    pullPolicy: IfNotPresent
  multus:
    create: false
    ipAdd: "172.21.6.12"
    netmask: "22"
    defaultGateway: "172.21.7.254"
    hostInterface: "bond0"  # Interface of the host machine on which this pod will be scheduled
  config:
    ueroute: 12.1.1.0/24
    upfHost: oai-upf
    routeInterface: eth0
    noOfIperf3Server: 2
  resources:
    define: false
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  nodeName: ""
oai-smf:
  enabled: true
  upfHostAlias: # resolves the made-up FQDN UPF-VPP (oai-upf-vpp) registers at the NRF with
    ip: "10.110.99.101"
    fqdn: "vpp-upf-slice1.node.5gcn.mnc01.mcc001.3gppnetwork.org"
    extra: # FQDNs of the other slices' UPF-VPP, see oai-5g-core/oai-smf/values.yaml
      - ip: "10.110.99.102"
        fqdn: "vpp-upf-slice2.node.5gcn.mnc01.mcc001.3gppnetwork.org"
      - ip: "10.110.99.103"
        fqdn: "vpp-upf-slice3.node.5gcn.mnc01.mcc001.3gppnetwork.org"
      - ip: "10.110.99.104"
        fqdn: "vpp-upf-slice4.node.5gcn.mnc01.mcc001.3gppnetwork.org"
  nfimage:  # image name either locally present or in a public/private repository
    repository: docker.io/library/oai-smf           ## The image will be pulled from dockerhub
    version: v2.2.1                         ## The branch to be used to pull from dockerhub
    # pullPolicy: IfNotPresent or Never or Always
    pullPolicy: Never
  includeTcpDumpContainer: false #only for taking pcaps inside network function pod
  multus:
    ## If you don't want to add a default route in your pod then replace this field with ""
    defaultGateway: ""
    n4Interface:
      create: false
      ipAdd: "192.168.24.3"
      netmask: "24"
      name: "n4"
      ## If you do not have a gateway leave the field empty
      gateway: ""
      ## If you do not want to add any routes in your pod then leave this field empty
      #routes: [{'dst': '10.8.0.0/24','gw': '172.21.7.254'}, {'dst': '10.9.0.0/24','gw': '172.21.7.254'}]
      hostInterface: "bond0"
