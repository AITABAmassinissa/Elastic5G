apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "oai-upf.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  {{- if .Values.global }}{{ if not .Values.global.clusterIpServiceIpAllocation }}
  clusterIP: None
  {{- end }}{{ end }}
  {{- if .Values.staticClusterIP }}
  # Fixed on purpose: the SMF resolves this UPF via a hostAliases entry (see the oai-smf*
  # chart) pointing at this exact IP, standing in for oai-upf-vpp's made-up FQDN which no
  # DNS server actually knows about. A dynamically-assigned ClusterIP would make that
  # mapping go stale on every recreation of this Service.
  clusterIP: {{ .Values.staticClusterIP }}
  {{- end }}
  ports:
    - name: pfcp
      port: {{ .Values.exposedPorts.n4 }}
      # Port to forward to inside the pod
      targetPort: {{ .Values.exposedPorts.n4 }}
      protocol: UDP
    - name: gtp
      port: {{ .Values.exposedPorts.n3 }}
      # Port to forward to inside the pod
      targetPort: {{ .Values.exposedPorts.n3 }}
      protocol: UDP
    - name: http
      port: {{ .Values.exposedPorts.sbi }}
      # Port to forward to inside the pod
      targetPort: {{ .Values.exposedPorts.sbi }}
      protocol: TCP
  selector:
    {{- include "oai-upf.selectorLabels" . | nindent 4 }}