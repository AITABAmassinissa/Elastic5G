# Remplace le lancement manuel de setup-host-net.sh (qui exigeait sudo + un accès
# shell direct à chaque nœud). Ce DaemonSet applique la même config réseau hôte
# (bridges Multus br-n3/br-n6, passerelle N6, routes de retour UE, NAT) sur TOUS
# les nœuds du cluster automatiquement, sans SSH — le conteneur tourne en
# hostNetwork + privileged, donc ses commandes `ip`/`iptables` s'appliquent
# directement à l'hôte, exactement comme le fait le DaemonSet flannel.
#
# Bonus : comme kubelet relance le pod après un reboot du nœud, la config réseau
# se réapplique toute seule — plus besoin de relancer le script à la main après
# chaque redémarrage.
#
# (UPF-VPP needs br-n3 / br-n6 on every node that can host the gNB and the UPF-VPP pods)
# kubectl apply -f oai-5g-core/host-net-setup/daemonset.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: host-net-setup
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: host-net-setup-script
  namespace: host-net-setup
data:
  setup.sh: |
    #!/bin/bash
    set -e

    EXT_IF="$(ip route get 8.8.8.8 2>/dev/null | sed -n 's/.* dev \([^ ]*\).*/\1/p' | head -1)"
    if [ -z "$EXT_IF" ] || ! ip link show "$EXT_IF" >/dev/null 2>&1; then
      echo "[$(hostname)] Impossible de détecter l'interface Internet, abandon." >&2
      exit 1
    fi
    echo "[$(hostname)] EXT_IF détectée : $EXT_IF"

    for b in n3 n6; do
      ip link show br-$b >/dev/null 2>&1 || ip link add br-$b type bridge
      ip link set br-$b up
    done

    for b in n3 n6; do
      ip link show dum-$b >/dev/null 2>&1 || ip link add dum-$b type dummy
      ip link set dum-$b master br-$b
      ip link set dum-$b up
    done

    ip addr del 10.100.6.1/24 dev br-n6 2>/dev/null || true
    ip link show mv-n6 >/dev/null 2>&1 || ip link add mv-n6 link br-n6 type macvlan mode bridge
    ip addr add 10.100.6.1/24 dev mv-n6 2>/dev/null || true
    ip link set mv-n6 up

    ip route replace 12.1.1.0/24 via 10.100.6.101 dev mv-n6
    ip route replace 12.1.2.0/24 via 10.100.6.102 dev mv-n6
    ip route replace 12.1.3.0/24 via 10.100.6.103 dev mv-n6
    ip route replace 12.1.4.0/24 via 10.100.6.104 dev mv-n6

    iptables -t nat -C POSTROUTING -s 12.1.0.0/16 -o "$EXT_IF" -j MASQUERADE 2>/dev/null \
      || iptables -t nat -A POSTROUTING -s 12.1.0.0/16 -o "$EXT_IF" -j MASQUERADE
    iptables -C FORWARD -i mv-n6 -o "$EXT_IF" -j ACCEPT 2>/dev/null \
      || iptables -I FORWARD -i mv-n6 -o "$EXT_IF" -j ACCEPT
    iptables -C FORWARD -i "$EXT_IF" -o mv-n6 -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null \
      || iptables -I FORWARD -i "$EXT_IF" -o mv-n6 -m state --state RELATED,ESTABLISHED -j ACCEPT

    sysctl -w net.ipv4.ip_forward=1

    echo "[$(hostname)] OK - config réseau hôte en place"
    sleep infinity
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: host-net-setup
  namespace: host-net-setup
spec:
  selector:
    matchLabels:
      app: host-net-setup
  template:
    metadata:
      labels:
        app: host-net-setup
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists   # tourne même sur le control-plane et des nœuds "tainted"
      containers:
        - name: host-net-setup
          image: nicolaka/netshoot:latest
          command: ["/bin/bash", "/script/setup.sh"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: script
              mountPath: /script
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: host-net-setup-script
            defaultMode: 0755
